# The needs crosscheck cannot find, because no build, test or patch shows them, kept by hand.
# A table per lesson; a key per page that lesson needs finished; its value says why, starting
# with its kind:
#   setup: the laptop or project the lesson works in.
#   skill: a step does a thing "as in" an earlier lesson, which teaches it.
#   robot: the robot is in a state an earlier lesson leaves it in.
# Teaching order is not a need, nor a back-reference to an idea. tools/needs.py adds
# needs-code.jsonc's code needs, takes the whole chain, and writes each lesson's list; run
# `python tools/run.py needs apply` after a change here. Read from v0.4.0's pages, 2026-11-01.

