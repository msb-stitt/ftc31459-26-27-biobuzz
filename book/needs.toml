# What crosscheck cannot find, because no build, test or patch shows it, kept by hand.
#
# A table per lesson; a key per page; its value says why, or is a list of whys, each starting
# with its kind:
#   setup: the laptop or project the lesson works in.
#   robot: the robot is in a state an earlier lesson leaves it in, the numbers in the robot's
#          constants file (pedro/Bot*.java) among them.
#   skill: a step uses a skill the page teaches.
# A setup: or robot: why is a need: the lesson will not work without that page. A skill, an idea
# taught earlier, or teaching order is not a need: a skill goes in the lesson's Skills needed and
# the teaching page's Skills learned. Name a skill in the same words each time, so it is one
# skill. tools/needs.py adds needs-code.jsonc's code needs, takes the whole chain, and writes each
# page's lists; run `python tools/run.py needs apply` after a change here. Read from v0.4.1's
# pages, 2026-11-02.

