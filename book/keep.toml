# The solutions line the answers and the cheat sheet are generated from, by
# applying its solutions/ in order. A blank commit is the normal state: the tools
# then read the ref beside it, so running them by hand reads the tip rather than
# asking anyone to paste a hash. Put a commit in to freeze a regeneration
# deliberately.
#
# lessons is read only by tools/diffs.py, behind `ninja review`, which still
# compares the lessons package with a solutions line's own.
[answers]
lessons = "HEAD"
lessons_commit = ""
solutions = "solutions-l010"
solutions_commit = ""
