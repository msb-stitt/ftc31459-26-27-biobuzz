# The solutions line the answers, the cheat sheet and the review are generated
# from, by applying its solutions/ in order. On a lessons branch at work it names
# the solutions branch, so the tools read its tip; on main it names a tag made by
# tools/pin.py. Change it with tools/pin.py, not by hand: the README's "Lesson
# work and releases" says how. pin.py leaves solutions_commit blank.
#
# lessons is read only by tools/diffs.py, behind `ninja review`, which still
# compares the lessons package with a solutions line's own.
[answers]
lessons = "HEAD"
lessons_commit = ""
solutions = "solutions-l135-menu-classes.3"
solutions_commit = ""

# The corbels-lfs-lessons branch the figures and videos are read from, named like this
# one, and the commit of it they are pinned to. tools/pin.py sets both: `pin` the
# commit, at the end of a round, and `pin --follow` the branch, clearing the commit.
# The build reads the commit, or the branch's tip while it is empty, and
# tools/publish_check.py fails when the checkout it is given is anywhere else.
[media]
repo = "https://github.com/msb-stitt/corbels-lfs-lessons.git"
ref = "lessons-l135-menu-classes"
commit = "525a4beb0080c863fd349d0e99ef463aff5fda76"
