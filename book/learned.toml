# What each lesson and what's-happening page teaches, beyond the skills needs.toml names.
#
# `needs.py apply` lists them, mentor-only, in the page's *Skills learned* and *Concepts learned*.
# A lesson has a skill here or a `skill:` entry naming it in needs.toml; a lesson or
# what's-happening page has a concept here. A concept opens with its area, one of needs.py's
# AREAS, then ": ". See WRITING.md.

[l020]
skills = [
  "pick a name from Android Studio's code completion list with Tab",
  "hold the pointer over a name to see what it is",
  "open a flight log in AdvantageScope and graph its values",
]
concepts = [
  "FTC programming: an OpMode is one program the robot can run; INIT runs its `init()` once, and PLAY runs its `start()` once",
  "FTC programming: `start()` hands `readTheSticks()` to the scheduler, which runs it over and over until STOP",
  "FTC programming: `@Disabled` hides an OpMode from the robot's list",
  "this project: `mytry` is where a student writes, and `lessons` holds the starters",
  "this project: the simulator is a robot that exists only in the laptop, and runs the OpMode as the real robot would",
  "Java: `double` is a number with a decimal point; a `float` is a smaller one, and a `double` holds any `float`",
  "Java: an `import` line, which Android Studio adds when a class is picked from the list",
  "game controllers: `gamepad1.left_stick_y` and `right_stick_y` read from -1.0 to 1.0, and forward is -1.0",
  "`CorbelsOpMode`: `Tracker.publish(name, value)` sends a value to AdvantageScope while the code runs, and writes it in the flight log",
  "NetworkTables: AdvantageScope connected to the simulator shows published values live",
  "log files: the flight log keeps the same names and values, to open in AdvantageScope after the run",
]

