repositories {
    maven { url 'https://jitpack.io' }   // corbelsflightlog, released
    mavenLocal()                        // or a locally built corbelsflightlog
    mavenCentral()
    google() // Needed for androidx
    maven { url 'https://repo.dairy.foundation/releases/'} // needed for pedropathing
}

dependencies {
    implementation 'org.firstinspires.ftc:Inspection:12.0.0'
    implementation 'org.firstinspires.ftc:Blocks:12.0.0'
    implementation 'org.firstinspires.ftc:RobotCore:12.0.0'
    implementation 'org.firstinspires.ftc:RobotServer:12.0.0'
    implementation 'org.firstinspires.ftc:OnBotJava:12.0.0'
    implementation 'org.firstinspires.ftc:Hardware:12.0.0'
    implementation 'org.firstinspires.ftc:FtcCommon:12.0.0'
    implementation 'org.firstinspires.ftc:Vision:12.0.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'com.pedropathing:revhub:3.0.2'
    implementation 'com.pedropathing:tuning:1.0.1'
}

// Pedro's core from msb-stitt's fork, on JitPack: 3.0.2 with its clock settable, so
// simRun's simulated time reaches the follower, its PIDs and its timers. On the robot
// it reads System.nanoTime() as 3.0.2 does.
configurations.all {
    resolutionStrategy.dependencySubstitution {
        substitute module('com.pedropathing:core') using module('com.github.msb-stitt:PedroPathing:v3.0.2-simclock.1')
    }
}

