[project]
name = "biobuzz-sim"
version = "0.1.0"
description = "The BIOBUZZ field and robots 31459 and 37523, their recipes and plugins, for the sim servers."
requires-python = ">=3.13"
dependencies = [
    "mujocobiobuzz",
    "scrimmage",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biobuzz_sim"]

[tool.uv.sources]
mujocobiobuzz = { git = "https://github.com/msb-stitt/mujocobiobuzz", branch = "scr-plugins" }
scrimmage = { git = "https://github.com/msb-stitt/scrimmage", branch = "multi-robot" }

[dependency-groups]
# OpenCASCADE's bindings, for `ninja model`'s conversion only.
cad = [
    "cadquery-ocp>=8.0.1.1.0",
    "fast-simplification>=0.2.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# MuJoCo, the Scrimmage fork and mujocobiobuzz ship no types.
[[tool.mypy.overrides]]
module = ["mujoco", "mujoco.*", "scrimmage", "scrimmage.*", "mujocobiobuzz", "mujocobiobuzz.*"]
ignore_missing_imports = true
