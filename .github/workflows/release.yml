# Publishes the books on gh-pages, and makes a release.
#
# Lesson work merges into dev; a release fast-forwards main to a commit of dev
# and tags it there.
#
# - A push to dev: the books built from it and from the solutions and media its
#   book/keep.toml pins, into dev/.
# - A tag such as v0.1.4-rc.1, on a commit of dev: the same, as a pre-release,
#   into its own folder, and a GitHub pre-release.
# - A tag vX.Y.Z, at main's head and on dev: the same, as a release, to the top
#   level, where the code's links point, and a GitHub Release.
# - A push to main publishes nothing. A run by hand builds, keeps the books as
#   an artifact, and publishes nothing.
#
# A tag's GitHub Release carries both PDFs, its videos, and the web pages with
# its videos as a zip, and its media commit is tagged in corbels-lfs-lessons
# with the same name, with the deploy key in the secret CORBELS_LFS_DEPLOY_KEY.
#
# gh-pages is made again on each publish, as one commit with no parent, by
# book/tools/assemble_pages.py: the newest release at the top level, the newest
# pre-release while it is newer, dev/, and no older version, each with its own
# videos/, which its pages link relatively. A PDF links a tag's videos in its
# GitHub Release, and dev's in dev/videos/. The front page links every
# version's GitHub Release. The figures and videos come from corbels-lfs-lessons
# at the commit book/keep.toml's [media] pins. Every LFS download counts against
# the owner's monthly LFS bandwidth, so only figures/ is pulled, cached by media
# commit, and a video is pulled only when gh-pages serves no copy of it.
name: Release

on:
  push:
    tags: ['v*', '!v*-solutions']
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: write

# Every run that publishes pushes to gh-pages. Do not cancel one in progress:
# each publishes its own version.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The solutions branch and gh-pages are read by name. The checkout makes the tag
      # that started the run a lightweight tag, which git describe skips and whose
      # message is the commit's, so every tag is fetched again as it was made.
      - name: Every branch as a local branch, and every tag as made
        run: |
          git fetch --update-head-ok origin '+refs/heads/*:refs/heads/*'
          git fetch --force origin '+refs/tags/*:refs/tags/*'

      - name: What this run publishes, and from which solutions
        id: what
        run: |
          # keep.toml names the solutions the answer pages and cheat sheet were
          # generated from; a release pins them to a tag, so it can be rebuilt.
          solutions=$(python3 -c 'import tomllib; a = tomllib.load(open("book/keep.toml", "rb"))["answers"]; print(a["solutions_commit"] or a["solutions"])')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
            if ! git rev-parse --verify --quiet "refs/tags/$solutions" >/dev/null; then
              echo "keep.toml names $solutions, which is not a tag. Run tools/pin.py, commit what it writes, and tag again."
              exit 1
            fi
            commit=$(git rev-parse "$version^{commit}")
            if ! git merge-base --is-ancestor "$commit" dev; then
              echo "$version is on $(git rev-parse --short "$commit"), which is not on dev. Tag a commit of dev."
              exit 1
            fi
            case "$version" in
              *-*) kind=pre ;;
              *)   kind=release
                   if [ "$commit" != "$(git rev-parse main)" ]; then
                     echo "$version is on $(git rev-parse --short "$commit"), and main is at $(git rev-parse --short main). Fast-forward main to the commit, then tag main's head."
                     exit 1
                   fi ;;
            esac
          elif [ "$GITHUB_REF" = refs/heads/dev ]; then
            version=dev kind=dev
          else
            version= kind=
          fi
          media=$(python3 -c 'import tomllib; m = tomllib.load(open("book/keep.toml", "rb"))["media"]; print(m["commit"] or m["ref"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "solutions=$solutions" >> "$GITHUB_OUTPUT"
          echo "media=$media" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "Publishing '${version:-nothing}', with the solutions at $solutions."

      - name: The figures' repository, without its LFS files
        uses: actions/checkout@v4
        with:
          repository: msb-stitt/corbels-lfs-lessons
          ref: ${{ steps.what.outputs.media }}
          path: media
          lfs: false

      - name: Which media commit
        id: media
        run: |
          # The checkout leaves LFS's filters and push hook out.
          git -C media lfs install --local
          echo "commit=$(git -C media rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: The media's LFS objects, from the cache
        uses: actions/cache@v4
        with:
          path: media/.git/lfs/objects
          key: lfs-figures-${{ steps.media.outputs.commit }}
          restore-keys: lfs-figures-

      - name: The figures, and nothing else, from LFS
        run: git -C media lfs pull --include 'figures/'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Point the build at the runner's Android SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Tests
        run: ./gradlew --no-daemon :TeamCode:test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ninja -r book/requirements.txt -r book/requirements-publish.txt

      - name: The guide's checks
        working-directory: book
        env:
          PYTHONPATH: tools
        run: |
          ninja check-sphinx check-wrap check-reading check-keep check-words check-figures
          python tools/answers.py --check
          python tools/cheatsheet.py --check

      # Builds the review too, which checks that each lesson's changes rebuild its patch.
      - name: Both books, the review and both PDFs
        working-directory: book
        env:
          KIND: ${{ steps.what.outputs.kind }}
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          # The PDFs link the videos of the version they are published as.
          if [ -n "$KIND" ]; then version="--as $KIND --version $VERSION"; else version=; fi
          python tools/run.py publish_check --media ../media --solutions '${{ steps.what.outputs.solutions }}' $version

      - uses: actions/upload-artifact@v4
        with:
          name: publish
          path: book/build/publish

      - name: gh-pages made again, as one commit with no parent
        if: steps.what.outputs.kind != ''
        env:
          KIND: ${{ steps.what.outputs.kind }}
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          git worktree add old gh-pages
          python book/tools/run.py assemble_pages --old old --built book/build/publish \
            --as "$KIND" --version "$VERSION" --out site --media media
          git worktree add --orphan -b new-pages fresh
          cp -R site/. fresh/
          cd fresh
          git add -A
          git -c user.name="Mike S.B. Stitt" -c user.email=mike@stitt.cc \
            commit -q -m "The site as published, with $VERSION built from $(git rev-parse --short "$GITHUB_SHA") by the release workflow."
          git push -f origin new-pages:gh-pages

      - name: The media commit tagged in corbels-lfs-lessons
        if: github.ref_type == 'tag'
        env:
          KEY: ${{ secrets.CORBELS_LFS_DEPLOY_KEY }}
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/corbels && chmod 600 ~/.ssh/corbels
          ssh-keyscan github.com 2>/dev/null >> ~/.ssh/known_hosts
          git -C media remote add archive git@github.com:msb-stitt/corbels-lfs-lessons.git
          git -C media config core.sshCommand 'ssh -i ~/.ssh/corbels -o IdentitiesOnly=yes'
          git -C media tag "$VERSION" HEAD
          git -C media push archive "refs/tags/$VERSION"

      - name: A GitHub Release with both PDFs, the videos and the web pages
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.what.outputs.version }}
          SOLUTIONS: ${{ steps.what.outputs.solutions }}
        run: |
          # The version's videos, as assemble_pages laid them out, for the PDFs' links and
          # beside the web pages in the zip, where the pages' relative links find them.
          case "$VERSION" in
            *-*) videos="$PWD/site/$VERSION" ;;
            *)   videos="$PWD/site" ;;
          esac
          zipped="$PWD/book/build/ftc31459-$VERSION-web.zip"
          (cd book/build/publish && zip -qr "$zipped" guide mentor review)
          (cd "$videos" && zip -qr "$zipped" videos)
          {
            git tag -l --format='%(contents)' "$VERSION"
            echo
            echo "The newest release, and every version, are at https://msb-stitt.github.io/ftc31459-26-27-biobuzz/."
            echo "This release's web pages are in \`ftc31459-$VERSION-web.zip\`: unzip it and open \`guide/index.html\`."
            echo
            echo "The answer pages and cheat sheet are built from the solutions at the tag \`$SOLUTIONS\`."
          } > notes.md
          case "$VERSION" in
            *-*) pre=--prerelease ;;
            *)   pre= ;;
          esac
          gh release create "$VERSION" book/build/publish/*.pdf "$videos"/videos/*.mp4 "$zipped" \
            --title "$VERSION" $pre --notes-file notes.md
