# Publishes the books on gh-pages, and makes a release.
#
# - A tag vX.Y.Z: the books built from the tag and from the solutions its
#   book/keep.toml pins, which has to be a tag made by tools/pin.py. They go into
#   vX.Y.Z/ and, if it is the newest release, to the top level, where the code's
#   links point. A GitHub Release gets both PDFs.
# - A tag such as v0.1.1-rc.1: the same, as a pre-release, which never takes the
#   top level.
# - A push to main: the same build, into dev/.
# - A push to a release-* branch, or a run by hand: the same build, kept as an
#   artifact, and nothing published. It is also archived in corbels-lfs-lessons
#   on the branch trial-<branch>, and the site assembled onto this repository's
#   branch trial-pages, to try the release path.
#
# A release is archived in corbels-lfs-lessons under its tag, with the deploy key
# in the secret CORBELS_LFS_DEPLOY_KEY. gh-pages is then made again as one commit
# with no parent, from every archived release, the media ref's videos/, and the
# old gh-pages' dev/; book/tools/assemble_pages.py lays it out. A push to main
# only replaces dev/, with a commit on top, so it copies no past release.
#
# book/tools/pages_site.py lays out gh-pages' front page and versions.json from
# the version folders. The figures come from corbels-lfs-lessons' figures/, at the
# ref book/keep.toml's [media] names. Every LFS download counts against the
# owner's monthly LFS bandwidth, so only what a run uses is pulled, and the LFS
# objects are cached by media commit and archive tags.
name: Release

on:
  push:
    tags: ['v*', '!v*-solutions']
    branches: [main, 'release-*']
  workflow_dispatch:

permissions:
  contents: write

# Every run that publishes pushes to gh-pages. Do not cancel one in progress:
# each publishes its own version.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The solutions branch and gh-pages are read by name.
      - name: Every branch as a local branch
        run: git fetch --update-head-ok origin '+refs/heads/*:refs/heads/*'

      - name: What this run publishes, and from which solutions
        id: what
        run: |
          # keep.toml names the solutions the answer pages and cheat sheet were
          # generated from; a release pins them to a tag, so it can be rebuilt.
          solutions=$(python3 -c 'import tomllib; a = tomllib.load(open("book/keep.toml", "rb"))["answers"]; print(a["solutions_commit"] or a["solutions"])')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
            if ! git rev-parse --verify --quiet "refs/tags/$solutions" >/dev/null; then
              echo "keep.toml names $solutions, which is not a tag. Run tools/pin.py, commit what it writes, and tag again."
              exit 1
            fi
            archive=tag
          else
            if [ "$GITHUB_REF" = refs/heads/main ]; then version=dev; else version=; fi
            case "$GITHUB_REF_NAME" in release-*) archive=trial ;; *) archive= ;; esac
          fi
          media=$(python3 -c 'import tomllib; print(tomllib.load(open("book/keep.toml", "rb"))["media"]["ref"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "solutions=$solutions" >> "$GITHUB_OUTPUT"
          echo "media=$media" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "Publishing '${version:-nothing}', with the solutions at $solutions."

      - name: The figures' repository, without its LFS files
        uses: actions/checkout@v4
        with:
          repository: msb-stitt/corbels-lfs-lessons
          ref: ${{ steps.what.outputs.media }}
          path: media
          lfs: false

      - name: Which media commit, and its archive tags
        id: media
        run: |
          # The checkout leaves LFS's filters and push hook out; add stores published/ through LFS.
          git -C media lfs install --local
          git -C media fetch -q --no-tags origin '+refs/tags/v*:refs/tags/v*'
          echo "commit=$(git -C media rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tags=$(git -C media tag -l 'v*' | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      # A run that assembles gh-pages needs every archived release; one that only
      # builds needs only figures/. Each saves under its own key, and restores the
      # nearest one saved before, so a past release is downloaded from LFS once.
      - name: The media's LFS objects, from the cache
        uses: actions/cache@v4
        with:
          path: media/.git/lfs/objects
          key: lfs-media-${{ steps.media.outputs.commit }}-${{ steps.media.outputs.tags }}-${{ steps.what.outputs.archive || 'build' }}
          restore-keys: |
            lfs-media-${{ steps.media.outputs.commit }}-${{ steps.media.outputs.tags }}-
            lfs-media-${{ steps.media.outputs.commit }}-
            lfs-media-

      - name: The figures, and nothing else, from LFS
        run: git -C media lfs pull --include 'figures/'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Point the build at the runner's Android SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Tests
        run: ./gradlew --no-daemon :TeamCode:test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ninja -r book/requirements.txt -r book/requirements-publish.txt

      - name: The guide's checks
        working-directory: book
        env:
          PYTHONPATH: tools
        run: |
          ninja check-sphinx check-wrap check-reading check-keep check-words check-figures
          python tools/answers.py --check
          python tools/cheatsheet.py --check

      # Builds the review too, which checks that each lesson's changes rebuild its patch.
      - name: Both books, the review and both PDFs
        working-directory: book
        run: python tools/run.py publish_check --media ../media --solutions '${{ steps.what.outputs.solutions }}'

      - uses: actions/upload-artifact@v4
        with:
          name: publish
          path: book/build/publish

      - name: The deploy key for corbels-lfs-lessons
        if: steps.what.outputs.archive != ''
        env:
          KEY: ${{ secrets.CORBELS_LFS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && printf '%s\n' "$KEY" > ~/.ssh/corbels && chmod 600 ~/.ssh/corbels
          ssh-keyscan -q github.com >> ~/.ssh/known_hosts
          git -C media remote add archive git@github.com:msb-stitt/corbels-lfs-lessons.git
          git -C media config core.sshCommand 'ssh -i ~/.ssh/corbels -o IdentitiesOnly=yes'

      - name: Archived in corbels-lfs-lessons
        if: steps.what.outputs.archive != ''
        working-directory: book
        run: |
          if [ '${{ steps.what.outputs.archive }}' = tag ]; then
            where=--tag
          else
            where="--branch trial-$GITHUB_REF_NAME"
          fi
          python tools/run.py archive_release --media ../media --built build/publish \
            --name "${{ steps.what.outputs.version || 'trial' }}" --remote archive $where
          git -C ../media fetch -q --no-tags origin '+refs/tags/v*:refs/tags/v*'

      - name: gh-pages made again, as one commit with no parent
        if: steps.what.outputs.archive != ''
        run: |
          git worktree add old gh-pages
          python book/tools/run.py assemble_pages --media media --out site --keep old
          if [ '${{ steps.what.outputs.archive }}' = trial ]; then
            target=trial-pages
            mkdir -p site/trial && cp -R book/build/publish/. site/trial/
          else
            target=gh-pages
          fi
          git worktree add --orphan -b new-pages fresh
          cp -R site/. fresh/
          cd fresh
          git add -A
          git -c user.name="Mike S.B. Stitt" -c user.email=mike@stitt.cc \
            commit -q -m "The site as published, from corbels-lfs-lessons, built from $(git rev-parse --short "$GITHUB_SHA") by the release workflow."
          git push -f origin "new-pages:$target"

      - name: dev/ published on gh-pages
        if: steps.what.outputs.version == 'dev'
        env:
          VERSION: ${{ steps.what.outputs.version }}
        run: |
          git worktree add pages gh-pages
          rm -rf "pages/$VERSION"
          mkdir "pages/$VERSION"
          cp -R book/build/publish/. "pages/$VERSION/"
          cd pages
          python ../book/tools/pages_site.py .
          git add -A
          git -c user.name="Mike S.B. Stitt" -c user.email=mike@stitt.cc \
            commit -q -m "$VERSION, built from $(git rev-parse --short "$GITHUB_SHA") by the release workflow."
          git push origin gh-pages

      - name: A GitHub Release with both PDFs
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.what.outputs.version }}
          SOLUTIONS: ${{ steps.what.outputs.solutions }}
        run: |
          site="https://msb-stitt.github.io/ftc31459-26-27-biobuzz/$VERSION"
          {
            git tag -l --format='%(contents)' "$VERSION"
            echo
            echo "- Student guide: $site/guide/"
            echo "- Mentor guide: $site/mentor/"
            echo "- What the student writes: $site/review/"
            echo
            echo "The answer pages and cheat sheet are built from the solutions at the tag \`$SOLUTIONS\`."
          } > notes.md
          case "$VERSION" in
            *-*) pre=--prerelease ;;
            *)   pre= ;;
          esac
          gh release create "$VERSION" book/build/publish/*.pdf --title "$VERSION" $pre --notes-file notes.md
