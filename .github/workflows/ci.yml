# Every push: the tests, and the guide.
#
# The guide is generated from two lines -- the lessons line it sits on, and the
# solutions it reads the answers from, which book/keep.toml names: a solutions
# branch while a lesson is worked on, a tag pinned by tools/pin.py on main. CI
# fetches what keep.toml names and checks the answer pages, the cheat sheet and
# the review against it on every branch.
name: CI

on: push

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # local.properties is gitignored, so the SDK path has to be written here.
      # Forward slashes, because a properties file reads a backslash as an escape.
      - name: Point the build at the runner's Android SDK
        shell: bash
        run: echo "sdk.dir=${ANDROID_SDK_ROOT//\\//}" > local.properties

      # Everything except the lessons package. On the lessons line a blank and a
      # regression look the same, which is why the lessons are a task of their own.
      - name: Tests
        shell: bash
        run: ./gradlew --no-daemon :TeamCode:test

      # A JVM that dies in native code writes its frames to hs_err_pid<pid>.log
      # and the console gets the header alone, so the Windows crash read as an
      # address in a DLL and nothing more. Keep the reports of a failing run.
      - name: Keep the reports of a failing run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            TeamCode/build/test-results/**
            TeamCode/build/reports/tests/**
            **/hs_err_pid*.log
            **/replay_pid*.log

  solutions-tests:
    name: lessons suite against the solutions (${{ matrix.os }})
    if: contains(github.ref_name, 'solutions')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Point the build at the runner's Android SDK
        shell: bash
        run: echo "sdk.dir=${ANDROID_SDK_ROOT//\\//}" > local.properties

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # On a solutions branch every lesson's copies and patches are applied to
      # mytry, so the whole lessons suite has to pass. This is the check the
      # lessons line cannot make.
      - name: Apply every lesson to mytry
        shell: bash
        run: |
          python - <<'EOF'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("apply", "solutions/apply.py")
          apply = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(apply)
          tree = Path.cwd()
          for lesson in (tree / "solutions" / "order").read_text().split():
              for kind, *rest in apply.steps(tree, lesson):
                  if kind == "copy":
                      apply.copy(tree, *rest)
                  elif kind == "patch":
                      apply.patch(tree, lesson, rest[0])
          EOF

      - name: Lessons suite
        shell: bash
        run: ./gradlew --no-daemon :TeamCode:testLessons

  docs:
    name: guide (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ninja from PyPI rather than a package manager, so one line serves all
      # three runners.
      - name: Tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install ninja -r book/requirements.txt

      # A pinned tag brings the branch it was made from too, so tools/pin.py can
      # tell whether the pin is stale.
      - name: Fetch the solutions keep.toml names
        shell: bash
        run: |
          ref=$(python -c 'import tomllib; a = tomllib.load(open("book/keep.toml", "rb"))["answers"]; print(a["solutions_commit"] or a["solutions"])')
          if git ls-remote --exit-code --tags origin "refs/tags/$ref" >/dev/null 2>&1; then
            git fetch --depth=1 origin "+refs/tags/$ref:refs/tags/$ref"
            branch=$(echo "$ref" | sed -E 's/\.[0-9]+$//')
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git fetch --update-head-ok --depth=1 origin "+refs/heads/$branch:refs/heads/$branch"
            fi
            echo "keep.toml names the tag $ref."
          elif git ls-remote --exit-code --heads origin "$ref" >/dev/null 2>&1; then
            git fetch --update-head-ok --depth=1 origin "+refs/heads/$ref:refs/heads/$ref"
            echo "keep.toml names the branch $ref."
          else
            echo "keep.toml names $ref, which is neither a tag nor a branch on origin. Push it first."
            exit 1
          fi

      # The checks that do not need the solutions line. Named one by one rather
      # than as `ninja book`, so the checks that need it run in their own step.
      # Anything added to the guide that needs no solutions belongs on this line.
      - name: Checks that need no solutions
        shell: bash
        working-directory: book
        run: >
          ninja check-sphinx check-wrap check-reading check-keep check-words
          check-figures

      # The pin first: a tag on main, and on a lessons branch a tag that is not
      # stale. Then the answer pages, the cheat sheet and the review, each
      # generated by applying the solutions/ keep.toml names.
      - name: Checks that need the solutions
        shell: bash
        working-directory: book
        env:
          PYTHONPATH: tools
        run: |
          python tools/pin.py --check --on '${{ github.ref_name }}'
          python tools/answers.py --check
          python tools/cheatsheet.py --check
          python tools/diffs.py --build
